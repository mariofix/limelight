[project]
name = "limelight"
version = "2026.3.0"
description = "Flask shiniest stars"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask>=3.1.0",
    "flask-migrate>=4.0.7",
    "flask-babel>=4.0.0",
    "flask-admin[sqlalchemy-with-utils,translation]>=2.0.2",
    "flask-debugtoolbar>=0.16.0",
    "flask-mailman>=1.1.1",
    "flask-security[babel,common,fsqla]>=5.5.2",
    "flask-limiter>=3.9.2",
    "flask-sitemapper>=1.8.1",
    "packaging>=24.2,<25.0",
    "pendulum>=3.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.19",
    "requests>=2.32.3",
    "trove-classifiers>=2024.10.21.16",
    "jinja2-humanize-extension>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "pre-commit>=4.0.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.autopep8]
max_line_length = 119
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[tool.black]
line-length = 119
target-version = ["py310"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test*.py"]

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 5
py_version = 310
